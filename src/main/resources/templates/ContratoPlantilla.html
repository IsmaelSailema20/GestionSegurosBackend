<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        h1 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { border: 1px solid #666; padding: 4px; }
        .caja-redondeada {
          background-color: #08645c;   /* color de fondo */
          color: white;               /* color del texto */
          padding: 10px;              /* espacio interno */
          border-radius: 12px;        /* radios de las esquinas */
          width: 200px;               /* ancho fijo (opcional) */
          text-align: center;         /* centrar texto */
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-4 text-center d-lg-flex align-items-lg-center caja-redondeada">
            <h2>
            WALK SEGUROS
            </h2>
        </div>
    </div>
</div>
<h1 style="padding: 10px;">Contrato de Seguro</h1>
<p><strong>Cliente:</strong> <span th:text="${cliente.nombre} + ' ' + ${cliente.apellido}"></span></p>
<p><strong>Plan:</strong> <span th:text="${seguro.nombre}"></span></p>
<p><strong>Agente:</strong> <span th:text="${agente.nombre} + ' ' + ${agente.apellido}"></span></p>
<p th:if="${fechaInicio!=null || fechaFin!=null}"><strong>Periodo:</strong>
    <span th:text="${#dates.format(fechaInicio, 'dd/MM/yyyy')}"></span>
    —
    <span th:text="${#dates.format(fechaFin, 'dd/MM/yyyy')}"></span>
</p>
<div th:if="${!condicionesMedicas.empty}">
    <h2>Condiciones Médicas</h2>
    <table>
        <thead>
        <tr><th>Diagnóstico</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${condicionesMedicas}">
            <td th:text="${c.diagnostico}"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:if="${!beneficiarios.empty}">
    <h2>Beneficiarios</h2>
    <table>
        <thead>
        <tr><th>Nombre</th><th>Genero</th><th>Direccion</th><th>Fecha de Nacimiento</th></tr>
        </thead>
        <tbody>
        <tr th:each="b : ${beneficiarios}">
            <td th:text="${b.nombre}"></td>
            <td th:text="${b.genero}"></td>
            <td th:text="${b.direccion}"></td>
            <td th:text="${b.fecha_nacimiento}"></td>
        </tr>
        </tbody>
    </table>
</div>


</body>
</html>
