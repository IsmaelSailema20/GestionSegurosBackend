<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { text-align: center; margin-top: 40px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      page-break-inside: avoid;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

<!-- CONTRATOS IMPAGOS -->
<div th:if="${contratosImpagos != null and !contratosImpagos.isEmpty()}">
  <h2>Reporte: Contratos Impagos</h2>
  <table>
    <thead>
    <tr>
      <th>ID Contrato</th>
      <th>Cliente</th>
      <th>Seguro</th>
      <th>Fecha Inicio</th>
      <th>Fecha Fin</th>
      <th>Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${contratosImpagos}">
      <td th:text="${c.id}"></td>
      <td th:text="${c.cliente.nombre + ' ' + c.cliente.apellido}"></td>
      <td th:text="${c.seguro.nombre}"></td>
      <td th:text="${#dates.format(c.fechaInicio, 'yyyy-MM-dd')}"></td>
      <td th:text="${#dates.format(c.fechaFin, 'yyyy-MM-dd')}"></td>
      <td th:text="${c.estado}"></td>
    </tr>
    </tbody>
  </table>
</div>

<!-- CONTRATOS POR CLIENTE -->
<div th:if="${contratosPorCliente != null and !contratosPorCliente.isEmpty()}">
  <h2>Reporte: Contratos por Cliente</h2>
  <table>
    <thead>
    <tr>
      <th>ID Contrato</th>
      <th>Cliente</th>
      <th>Seguro</th>
      <th>Fecha Inicio</th>
      <th>Fecha Fin</th>
      <th>Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${contratosPorCliente}">
      <td th:text="${c.id}"></td>
      <td th:text="${c.cliente.nombre + ' ' + c.cliente.apellido}"></td>
      <td th:text="${c.seguro.nombre}"></td>
      <td th:text="${#dates.format(c.fechaInicio, 'yyyy-MM-dd')}"></td>
      <td th:text="${#dates.format(c.fechaFin, 'yyyy-MM-dd')}"></td>
      <td th:text="${c.estado}"></td>
    </tr>
    </tbody>
  </table>
</div>

<!-- CONTRATOS VENCIDOS O POR VENCER -->
<div th:if="${contratosVencidos != null and !contratosVencidos.isEmpty()}">
  <h2>Reporte: Contratos Vencidos o por Vencer</h2>
  <table>
    <thead>
    <tr>
      <th>ID Contrato</th>
      <th>Cliente</th>
      <th>Seguro</th>
      <th>Fecha Fin</th>
      <th>Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${contratosVencidos}">
      <td th:text="${c.id}"></td>
      <td th:text="${c.cliente.nombre + ' ' + c.cliente.apellido}"></td>
      <td th:text="${c.seguro.nombre}"></td>
      <td th:text="${#dates.format(c.fechaFin, 'yyyy-MM-dd')}"></td>
      <td th:text="${c.estado}"></td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
